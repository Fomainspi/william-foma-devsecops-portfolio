name: DevSecOps CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-scan:
    name: Test and security checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Generate CycloneDX SBOM
        run: mvn --batch-mode --no-transfer-progress org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom

      - name: Build container image for scanning
        run: docker build --pull -t william-foma-portfolio:ci .

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: william-foma-portfolio:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

      - name: Scan repository for vulnerabilities and secrets with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

      - name: Upload test reports and SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-${{ github.sha }}
          path: |
            target/surefire-reports/**
            target/bom.json
          if-no-files-found: warn
          retention-days: 14

  publish-artifact:
    name: Publish versioned JAR to JFrog
    needs: validate-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build release candidate
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v5.3.1
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_USER: ${{ vars.JF_USER }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Verify JFrog connection
        run: jf rt ping

      - name: Build and tag release container image
        env:
          BUILD_VERSION: 0.1.0-${{ github.run_number }}-${{ github.sha }}
        run: |
          set -euo pipefail
          test -f target/portfolio.jar
          docker build --pull -t "williamdev.jfrog.io/foma-docker-local/william-foma-portfolio:${BUILD_VERSION}" .

      - name: Push versioned container image to JFrog
        env:
          JF_USER: ${{ vars.JF_USER }}
          BUILD_VERSION: 0.1.0-${{ github.run_number }}-${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${JF_USER:-}" ]; then
            echo "::error::Missing GitHub Actions variable JF_USER. Set it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          jf docker push "williamdev.jfrog.io/foma-docker-local/william-foma-portfolio:${BUILD_VERSION}" --build-name=william-foma-portfolio --build-number="${GITHUB_RUN_NUMBER}"

      - name: Upload JAR to Maven repository layout
        env:
          BUILD_VERSION: 0.1.0-${{ github.run_number }}-${{ github.sha }}
        run: |
          set -euo pipefail
          test -f target/portfolio.jar
          jf rt upload "target/portfolio.jar" "foma-maven-local/com/williamfoma/william-foma-devsecops-portfolio/${BUILD_VERSION}/william-foma-devsecops-portfolio-${BUILD_VERSION}.jar"             --build-name=william-foma-portfolio             --build-number="${GITHUB_RUN_NUMBER}"
          sha256sum target/portfolio.jar | tee target/portfolio.jar.sha256
          jf rt upload target/portfolio.jar.sha256 "foma-maven-local/com/williamfoma/william-foma-devsecops-portfolio/${BUILD_VERSION}/william-foma-devsecops-portfolio-${BUILD_VERSION}.jar.sha256"

      - name: Publish build information
        run: jf rt build-publish william-foma-portfolio "${GITHUB_RUN_NUMBER}"

      - name: Upload published build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jfrog-publish-evidence-${{ github.run_number }}
          path: target/portfolio.jar.sha256
          if-no-files-found: warn
          retention-days: 14
